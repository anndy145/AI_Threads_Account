<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Threads AI 帳號標記</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Threads AI 帳號標記</h1>
      <form id="account-search">
        <label for="account">Threads 帳號</label>
        <div class="search-row">
          <input id="account" type="search" placeholder="@帳號或 Threads 網址"
                 autocomplete="off" spellcheck="false" aria-describedby="search-result">
          <button id="fill-account" type="button">帶入帳號</button>
          <button type="submit">搜尋</button>
        </div>
        <p id="search-result" role="status"></p>
        <label for="account-type">新增標記類型</label>
        <div class="search-row">
          <select id="account-type">
            <option value="ai">AI 帳號</option>
            <option value="green">白名單</option>
          </select>
          <button type="submit" value="add">新增標記</button>
        </div>
      </form>
      <section class="lookup-settings" aria-labelledby="lookup-title">
        <h2 id="lookup-title">顯示標籤</h2>
        <label><input id="lookup-location" type="checkbox" disabled> 個人檔案所在地</label>
        <label id="topic-group-label"><input id="lookup-topics" type="checkbox" disabled> 個人檔案標籤</label>
        <div class="topic-options" role="group" aria-labelledby="topic-group-label">
          <label><input id="lookup-aiThreads" type="checkbox" disabled> AI Threads</label>
          <label><input id="lookup-aiArt" type="checkbox" disabled> AI Art</label>
        </div>
        <label><input id="lookup-allowlist" type="checkbox" disabled> 我的白名單</label>
        <label><input id="lookup-manualAi" type="checkbox" disabled> 我的 AI 名單標記</label>
        <p id="lookup-status" role="status"></p>
      </section>
      <section aria-labelledby="personal-lists-title">
        <h2 id="personal-lists-title">個人名單</h2>
        <p id="list-status" role="status"></p>
        <h3>白名單</h3>
        <ul id="manual-green" class="account-list" aria-label="個人白名單"></ul>
        <h3>AI 標記</h3>
        <ul id="manual-ai" class="account-list" aria-label="個人 AI 標記"></ul>
      </section>
    </main>
    <script src="../shared/account-list.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
