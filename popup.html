<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Threads AI 帳號標記</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">MVP · 人工名單</p>
      <h1>Threads AI 帳號標記</h1>
      <p class="summary">在 Threads 頁面中，替名單內帳號加上清楚的提示徽章。</p>
      <section aria-labelledby="edit-list-title">
        <h2 id="edit-list-title">更新名單</h2>
        <ol>
          <li>編輯擴充功能資料夾中的 <code>threads_list.txt</code>。</li>
          <li>每行填入一個 Threads 個人頁網址或 <code>@帳號</code>。</li>
          <li>到 <code>chrome://extensions</code> 按「重新載入」，再重新整理 Threads。</li>
        </ol>
      </section>
      <p class="notice">此工具只依你提供的名單標記，並不自行判定帳號是否由 AI 生成。</p>
    </main>
  </body>
</html>
